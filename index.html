<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahels Zeitreise · Konfirmation 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --purple: #534AB7;
    --purple-light: #EEEDFE;
    --purple-mid: #AFA9EC;
    --purple-dark: #3C3489;
    --gold: #BA7517;
    --gold-light: #FAEEDA;
    --teal: #1D9E75;
    --teal-light: #E1F5EE;
    --pink: #D4537E;
    --pink-light: #FBEAF0;
    --bg: #FAF9F6;
    --bg-card: #FFFFFF;
    --text: #1a1a2e;
    --text-muted: #6b6b8a;
    --text-light: #a0a0b8;
    --border: rgba(83,74,183,0.12);
    --border-strong: rgba(83,74,183,0.25);
    --radius: 16px;
    --radius-sm: 10px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HERO ── */
  .hero {
    background: linear-gradient(160deg, #26215C 0%, #534AB7 60%, #7F77DD 100%);
    padding: 3.5rem 1.5rem 5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 20% 80%, rgba(255,255,255,0.06) 0%, transparent 50%),
                      radial-gradient(circle at 80% 20%, rgba(255,255,255,0.06) 0%, transparent 50%);
  }
  .hero-cross { display: none; }

  #pw-screen {
    position: fixed; inset: 0; z-index: 100;
    background: linear-gradient(160deg, #26215C 0%, #534AB7 60%, #7F77DD 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem;
  }
  #pw-screen h2 { font-family: 'Playfair Display', serif; font-size: 2rem; color: #fff; text-align: center; margin-bottom: 6px; }
  #pw-screen h2 em { font-style: italic; color: #FAC775; }
  #pw-screen p { font-size: 14px; color: rgba(255,255,255,0.65); margin-bottom: 2rem; text-align: center; }
  #pw-input {
    width: 100%; max-width: 280px; padding: 14px 18px;
    border-radius: 12px; border: none;
    font-size: 16px; font-family: 'DM Sans', sans-serif;
    text-align: center; letter-spacing: 0.1em;
    background: rgba(255,255,255,0.15); color: #fff;
    outline: none; margin-bottom: 12px;
  }
  #pw-input::placeholder { color: rgba(255,255,255,0.45); letter-spacing: 0; }
  #pw-input:focus { background: rgba(255,255,255,0.25); }
  #pw-btn {
    width: 100%; max-width: 280px; padding: 14px;
    border-radius: 12px; border: none;
    background: #FAC775; color: #412402;
    font-size: 15px; font-weight: 500; font-family: 'DM Sans', sans-serif;
    cursor: pointer; transition: background 0.15s;
  }
  #pw-btn:hover { background: #EF9F27; }
  #pw-error { font-size: 13px; color: #F09595; margin-top: 10px; min-height: 18px; }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 8vw, 3rem);
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.5px;
    line-height: 1.15;
    animation: fadeDown 0.8s 0.1s ease both;
  }
  .hero h1 em { font-style: italic; color: #FAC775; }
  .hero-sub {
    font-size: 0.95rem;
    color: rgba(255,255,255,0.7);
    margin-top: 0.5rem;
    font-weight: 300;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    animation: fadeDown 0.8s 0.2s ease both;
  }
  .hero-waves {
    position: absolute;
    bottom: -2px; left: 0; right: 0;
    height: 60px;
    overflow: hidden;
  }
  .hero-waves svg { width: 100%; height: 100%; }

  @keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:none; } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(16px); }  to { opacity:1; transform:none; } }

  /* ── CHAPTER NAV ── */
  .chapter-nav {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 1.25rem 1.25rem 0;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .chapter-nav::-webkit-scrollbar { display: none; }
  .nav-pill {
    flex-shrink: 0;
    padding: 7px 16px;
    border-radius: 20px;
    border: 1px solid var(--border-strong);
    background: var(--bg-card);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .nav-pill:hover { border-color: var(--purple-mid); color: var(--purple-dark); }
  .nav-pill.active { background: var(--purple); border-color: var(--purple); color: #fff; }

  /* ── CHAPTER SECTIONS ── */
  .chapter { display: none; padding: 1.5rem 1.25rem 0; animation: fadeUp 0.3s ease both; }
  .chapter.active { display: block; }

  .chapter-eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--purple);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chapter-eyebrow::after { content: ''; flex: 1; height: 1px; background: var(--border-strong); }
  .chapter-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .chapter-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 1.25rem; }

  /* ── MEDIA GRID ── */
  .media-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 1rem;
  }
  .media-slot {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    border: 1.5px dashed var(--border-strong);
    background: var(--purple-light);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.18s;
    position: relative;
    overflow: hidden;
  }
  .media-slot:hover { border-color: var(--purple); background: #CECBF650; }
  .media-slot .slot-icon { font-size: 1.75rem; opacity: 0.35; }
  .media-slot .slot-label { font-size: 11px; color: var(--text-light); margin-top: 4px; }
  .media-slot img, .media-slot video { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .media-slot.video-wide { grid-column: span 2; aspect-ratio: 16/9; }
  .del-btn {
    position: absolute;
    top: 5px; right: 5px;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 3;
    border: none;
  }
  .play-overlay {
    position: absolute;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    z-index: 2;
  }
  .play-overlay::after { content: '▶'; color: #fff; font-size: 16px; margin-left: 3px; }

  .add-media-btn {
    width: 100%;
    padding: 10px;
    border-radius: var(--radius-sm);
    border: 1.5px dashed var(--border-strong);
    background: transparent;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    margin-bottom: 1rem;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }
  .add-media-btn:hover { border-color: var(--purple); color: var(--purple); }

  /* ── TEXT FIELD ── */
  .field-label { font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; display: block; }
  .text-field {
    width: 100%;
    padding: 10px 13px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--bg-card);
    font-size: 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    line-height: 1.55;
    resize: none;
    transition: border-color 0.15s;
  }
  .text-field:focus { outline: none; border-color: var(--purple); }

  /* ── DIVIDER ── */
  .divider { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }

  /* ── QUIZ SECTION ── */
  .section-head { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
  .section-sub  { font-size: 13px; color: var(--text-muted); margin-bottom: 1rem; }

  .quiz-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    margin-bottom: 10px;
  }
  .quiz-card input[type=text] {
    width: 100%; padding: 8px 10px;
    border-radius: 8px; border: 1px solid var(--border-strong);
    font-size: 13px; color: var(--text); font-family: 'DM Sans', sans-serif;
    background: var(--bg); margin-bottom: 8px;
  }
  .quiz-options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .quiz-options-grid input { width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border-strong); font-size: 12px; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
  .correct-row { margin-top: 6px; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .correct-row select { font-size: 12px; border: 1px solid var(--border-strong); border-radius: 6px; padding: 3px 7px; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }

  .add-q-btn {
    width: 100%; padding: 9px;
    border-radius: var(--radius-sm);
    border: 1px dashed var(--border-strong);
    background: transparent;
    font-size: 13px; color: var(--text-muted);
    cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s;
  }
  .add-q-btn:hover { border-color: var(--purple); color: var(--purple); }

  /* ── QUIZ PLAY (Preview) ── */
  .qp-progress { display: flex; gap: 4px; margin-bottom: 14px; }
  .qp-dot { flex: 1; height: 4px; border-radius: 2px; background: var(--border-strong); }
  .qp-dot.done { background: var(--purple); }
  .qp-dot.curr { background: var(--purple-mid); }
  .qp-question { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 12px; line-height: 1.4; }
  .qp-opts { display: flex; flex-direction: column; gap: 8px; }
  .qp-opt {
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--bg-card);
    font-size: 14px; color: var(--text);
    cursor: pointer; text-align: left;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }
  .qp-opt:hover:not(:disabled) { border-color: var(--purple); background: var(--purple-light); }
  .qp-opt.correct  { background: #EAF3DE; border-color: #639922; color: #27500A; }
  .qp-opt.wrong    { background: #FCEBEB; border-color: #E24B4A; color: #791F1F; }
  .qp-next-btn {
    width: 100%; margin-top: 12px; padding: 12px;
    border-radius: var(--radius-sm);
    background: var(--purple); border: none;
    color: #fff; font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s;
  }
  .qp-next-btn:hover { background: var(--purple-dark); }
  .qp-score { text-align: center; padding: 1.5rem 0; }
  .qp-score .score-num { font-family: 'Playfair Display', serif; font-size: 3.5rem; color: var(--purple); }
  .qp-score p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
  .qp-replay { margin-top: 12px; padding: 10px 24px; border-radius: var(--radius-sm); background: var(--purple-light); border: 1px solid var(--purple-mid); color: var(--purple-dark); font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; }

  /* ── GREETINGS ── */
  .greeting-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    margin-bottom: 8px;
    position: relative;
  }
  .gc-name { font-size: 14px; font-weight: 500; color: var(--purple-dark); }
  .gc-msg  { font-size: 13px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
  .gc-time { font-size: 11px; color: var(--text-light); margin-top: 5px; }
  .heart-icon { color: var(--pink); }

  .send-btn {
    width: 100%; padding: 12px;
    border-radius: var(--radius-sm);
    background: var(--purple); border: none;
    color: #fff; font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    margin-top: 6px; transition: background 0.15s;
  }
  .send-btn:hover { background: var(--purple-dark); }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.5rem 0 0.5rem;
  }
  .nav-arrow {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 18px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--bg-card);
    font-size: 13px; color: var(--text-muted);
    cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s;
  }
  .nav-arrow:hover:not(:disabled) { border-color: var(--purple); color: var(--purple); }
  .nav-arrow:disabled { opacity: 0.3; cursor: default; }
  .nav-arrow.fwd { background: var(--purple); border-color: var(--purple); color: #fff; }
  .nav-arrow.fwd:hover { background: var(--purple-dark); border-color: var(--purple-dark); }
  .chapter-counter { font-size: 13px; color: var(--text-light); }

  /* ── MODE TOGGLE ── */
  .mode-bar {
    display: flex;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.25rem;
    gap: 8px;
    position: sticky; top: 0; z-index: 10;
  }
  .mode-btn {
    flex: 1; padding: 9px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: transparent;
    font-size: 13px; font-weight: 500; color: var(--text-muted);
    cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s;
  }
  .mode-btn.active { background: var(--purple); border-color: var(--purple); color: #fff; }

  /* ── PREVIEW HEADER PER CHAPTER ── */
  .pv-chapter { padding: 1.25rem; border-bottom: 1px solid var(--border); }
  .pv-chapter:last-child { border-bottom: none; }
  .pv-eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--purple); margin-bottom: 3px; }
  .pv-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 8px; color: var(--text); }
  .pv-photos { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 10px; }
  .pv-photos::-webkit-scrollbar { display: none; }
  .pv-photo { flex-shrink: 0; width: 88px; height: 88px; border-radius: 10px; object-fit: cover; }
  .pv-video { width: 100%; border-radius: 10px; margin-bottom: 8px; background: #000; }
  .pv-text { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 8px; }

  /* ── MEMORY GAME ── */
  .memory-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 1rem;
  }
  .mem-card {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    cursor: pointer;
    perspective: 600px;
    position: relative;
  }
  .mem-inner {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.4s ease;
    border-radius: var(--radius-sm);
  }
  .mem-card.flipped .mem-inner { transform: rotateY(180deg); }
  .mem-card.matched .mem-inner { transform: rotateY(180deg); }
  .mem-card.matched .mem-front { border: 2px solid var(--teal); }
  .mem-front, .mem-back {
    position: absolute; inset: 0;
    border-radius: var(--radius-sm);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }
  .mem-back {
    background: linear-gradient(135deg, var(--purple) 0%, #7F77DD 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.75rem;
  }
  .mem-front {
    transform: rotateY(180deg);
    background: var(--bg-card);
  }
  .mem-front img { width: 100%; height: 100%; object-fit: cover; }
  .memory-stats {
    display: flex; justify-content: space-between;
    background: var(--bg-card); border-radius: var(--radius-sm);
    padding: 10px 14px; margin-bottom: 1rem;
    border: 1px solid var(--border);
    font-size: 14px; color: var(--text-muted);
  }
  .memory-stats span { font-weight: 500; color: var(--purple); }
  .memory-win {
    text-align: center; padding: 2rem 1rem;
    background: var(--purple-light); border-radius: var(--radius);
    margin-bottom: 1rem;
  }
  .memory-win .win-emoji { font-size: 3rem; display: block; margin-bottom: 8px; }
  .memory-win h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--purple-dark); margin-bottom: 4px; }
  .memory-win p { font-size: 14px; color: var(--text-muted); }
  .memory-restart {
    margin-top: 12px; padding: 11px 24px;
    border-radius: var(--radius-sm); border: none;
    background: var(--purple); color: #fff;
    font-size: 14px; font-weight: 500; font-family: 'DM Sans', sans-serif;
    cursor: pointer;
  }
  .footer { text-align: center; padding: 2rem 1.5rem; font-size: 12px; color: var(--text-light); }
  .footer em { font-style: italic; font-family: 'Playfair Display', serif; }

  /* ── UTIL ── */
  .hidden { display: none !important; }
  .empty-hint { font-size: 12px; color: var(--text-light); margin-bottom: 8px; font-style: italic; }
</style>
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="pw-screen">
  <h2>Rahels<br><em>Zeitreise</em></h2>
  <p>Konfirmation 2025 · Nur für Gäste</p>
  <input type="password" id="pw-input" placeholder="Passwort eingeben" onkeydown="if(event.key==='Enter')checkPw()">
  <button id="pw-btn" onclick="checkPw()">Eintreten</button>
  <div id="pw-error"></div>
</div>

<!-- HERO -->
<div class="hero">
  <span class="hero-cross">✝</span>
  <h1>Rahels<br><em>Zeitreise</em></h1>
  <p class="hero-sub">Konfirmation 2025</p>
  <div class="hero-waves">
    <svg viewBox="0 0 1200 60" preserveAspectRatio="none" fill="#FAF9F6">
      <path d="M0,30 C200,60 400,0 600,30 C800,60 1000,0 1200,30 L1200,60 L0,60 Z"/>
    </svg>
  </div>
</div>

<!-- ADMIN BUTTON (subtle, bottom right) -->
<div id="admin-bar" style="position:fixed;bottom:16px;right:16px;z-index:50;">
  <button onclick="openAdminPw()" style="padding:8px 14px;border-radius:20px;border:1px solid var(--border-strong);background:var(--bg-card);font-size:12px;color:var(--text-light);cursor:pointer;font-family:'DM Sans',sans-serif;">⚙ Admin</button>
</div>

<!-- ADMIN PASSWORD OVERLAY -->
<div id="admin-pw-screen" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(26,26,46,0.85);align-items:center;justify-content:center;flex-direction:column;padding:2rem;">
  <div style="background:var(--bg-card);border-radius:16px;padding:2rem;width:100%;max-width:300px;text-align:center;">
    <p style="font-size:16px;font-weight:500;color:var(--text);margin-bottom:6px;">Admin-Zugang</p>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:1.25rem;">Passwort für den Bearbeitungsmodus</p>
    <input type="password" id="admin-pw-input" placeholder="Admin-Passwort" onkeydown="if(event.key==='Enter')checkAdminPw()" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border-strong);font-size:14px;font-family:'DM Sans',sans-serif;text-align:center;margin-bottom:10px;background:var(--bg);color:var(--text);outline:none;">
    <button onclick="checkAdminPw()" style="width:100%;padding:12px;border-radius:10px;border:none;background:var(--purple);color:#fff;font-size:14px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;margin-bottom:8px;">Einloggen</button>
    <button onclick="closeAdminPw()" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border-strong);background:transparent;font-size:13px;color:var(--text-muted);cursor:pointer;font-family:'DM Sans',sans-serif;">Abbrechen</button>
    <div id="admin-pw-error" style="font-size:12px;color:#E24B4A;margin-top:8px;min-height:16px;"></div>
  </div>
</div>

<!-- EDIT MODE -->
<div id="edit-mode">
  <nav class="chapter-nav" id="chapter-nav"></nav>
  <div id="chapters-container"></div>
</div>

<!-- PREVIEW MODE -->
<div id="preview-mode" class="hidden">
  <div id="preview-content"></div>
  <!-- Greetings in preview -->
  <div style="padding:1.25rem; border-top:1px solid var(--border);">
    <p class="pv-eyebrow">Glückwünsche</p>
    <p class="pv-title" style="font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:4px;color:var(--text)">Schreib Rahel etwas ✉️</p>
    <p class="section-sub">WhatsApp öffnet sich mit deiner Nachricht — einfach abschicken!</p>
    <div id="preview-greetings-list"></div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">
      <input type="text" id="pg-name" class="text-field" placeholder="Dein Name" style="resize:none">
      <textarea class="text-field" id="pg-msg" rows="3" placeholder="Deine Nachricht an Rahel..."></textarea>
      <button class="send-btn" onclick="sendGreetingPreview()">💚 Via WhatsApp an Rahel senden</button>
    </div>
  </div>
  <div class="footer"><em>Mit Liebe gemacht</em> · Konfirmation Rahel 2025</div>
</div>

<input type="file" id="file-input" accept="image/*,video/*" style="display:none">

<script>
const CHAPTERS = [
  { id:'baby',    label:'👶 Baby',        years:'2009–2010', title:'Willkommen, Rahel!',    desc:'Die allerersten Monate' },
  { id:'klein',   label:'🌱 Kleinkind',   years:'2011–2013', title:'Kleine Schritte',       desc:'Erste Worte, erste Abenteuer' },
  { id:'kiga',    label:'🎨 Kindergarten',years:'2014–2015', title:'Im Kindergarten',       desc:'Neue Freunde entdecken' },
  { id:'schule',  label:'📚 Schule',      years:'2016–2022', title:'Schulzeit',             desc:'Lernen, wachsen, lachen' },
  { id:'hobbys',  label:'🎵 Hobbys',      years:'Leidenschaft', title:'Was Rahel liebt',   desc:'Talente und Interessen' },
  { id:'freunde', label:'🤝 Freunde',     years:'Für immer',  title:'Beste Freunde',       desc:'Die die zählen' },
  { id:'heute',   label:'🎉 Heute',       years:'2025',       title:'Der grosse Tag',      desc:'Konfirmation' },
  { id:'memory',  label:'🃏 Memory',      years:'Spiel',      title:'Memory',              desc:'Finde alle Paare!' },
];

let state = {
  mode: 'edit',
  active: 0,
  chapters: CHAPTERS.map((c, i) => {
    if (c.id === 'hobbys') return {
      ...c,
      media: [],
      text: 'Rahel liebt Pferde und Katzen, fährt Ski und reitet gerne. Sie kocht und bäckt experimentell und hat ein echtes Händchen dafür. Kreativ ist sie sowieso: Aquarellmalerei, Beauty und Deutschrap gehören genauso dazu wie Abende mit Kolleginnen. Ihr Gerechtigkeitssinn ist legendär, ihre Empathie für Menschen und Tiere riesig — und emotional wie ihr Vater, aber wir haben sie gerne so wie sie ist!',
      quiz: [
        { q: 'Rahel liebt den Porsche GT3 — was passiert ihr aber im Tesla?', opts: ['Sie singt begeistert mit', 'Wird ihr übel von Beschleunigung und Kurven', 'Sie schläft sofort ein', 'Sie bestellt sich gleich einen'], correct: 1 },
        { q: 'Was geschah am 26. Dezember am Aussenreck?', opts: ['Bestes Weihnachtsgeschenk ever', 'Elle & Speiche gebrochen — Ambulanz ins Inselspital Bern', 'Erstes Skirennen gewonnen', 'Eine Katze adoptiert'], correct: 1 },
        { q: 'Welchen Beruf wird Rahel sicher NICHT ergreifen?', opts: ['Köchin', 'Reiterin', 'Ärztin / medizinischer Beruf', 'Künstlerin'], correct: 2 },
        { q: 'Was hat Rahel in ihrer Schülerarbeit gemacht?', opts: ['Kuchen-Rezeptbuch geschrieben', 'Ein Bild mit Aquarellfarben gemalt', 'Ein Pferdetagebuch verfasst', 'Eine Beauty-Kollektion kreiert'], correct: 1 },
        { q: 'Welche Musik hört Rahel am liebsten?', opts: ['Klassik beim Kochen', 'Schlager beim Reiten', 'Deutschrap — je derber, desto besser', 'Nur absolute Stille'], correct: 2 },
        { q: 'Was beschreibt Rahel am besten?', opts: ['Introvertiert und immer ruhig', 'Empathisch, sozial, emotional und kreativ', 'Pünktlich wie eine Schweizer Uhr', 'Gleichgültig gegenüber Tieren'], correct: 1 },
      ]
    };
    return { ...c, media: i === 0 ? [{ url: 'Screenshot_2026-05-10_at_20_28_22.png', type: 'image' }] : [], text: '', quiz: [] };
  }),
  greetings: [],
  quizScores: {},
};
let pendingSlot = null;

// ── MODE ──
function setMode(m) {
  state.mode = m;
  document.getElementById('edit-mode').classList.toggle('hidden', m !== 'edit');
  document.getElementById('preview-mode').classList.toggle('hidden', m !== 'preview');
  document.getElementById('btn-edit').classList.toggle('active', m === 'edit');
  document.getElementById('btn-preview').classList.toggle('active', m === 'preview');
  if (m === 'preview') renderPreview();
}

// ── NAV ──
function renderNav() {
  document.getElementById('chapter-nav').innerHTML = CHAPTERS.map((c, i) =>
    `<button class="nav-pill${state.active === i ? ' active' : ''}" onclick="setChapter(${i})">${c.label}</button>`
  ).join('');
}
function setChapter(i) {
  state.active = i;
  renderNav();
  renderChapter();
}

// ── CHAPTER EDIT ──
function renderChapter() {
  const i = state.active;
  const ch = state.chapters[i];
  const container = document.getElementById('chapters-container');

  // Memory chapter
  if (ch.id === 'memory') {
    container.innerHTML = `
      <div class="chapter active">
        <div class="chapter-eyebrow">Spiel</div>
        <h2 class="chapter-title">Memory</h2>
        <p class="chapter-desc">Finde alle Paare von Rahels Fotos!</p>
        <div id="memory-container"></div>
        <div class="bottom-nav">
          <button class="nav-arrow" onclick="setChapter(${i-1})">← Zurück</button>
          <span class="chapter-counter">${i+1} / ${CHAPTERS.length}</span>
          <button class="nav-arrow fwd" onclick="setChapter(${i+1})" disabled>Weiter →</button>
        </div>
      </div>`;
    initMemory();
    return;
  }
  container.innerHTML = `
    <div class="chapter active" id="ch-${i}">
      <div class="chapter-eyebrow">${ch.years}</div>
      <h2 class="chapter-title">${ch.title}</h2>
      <p class="chapter-desc">${ch.desc}</p>

      <div class="media-grid" id="media-grid-${i}">${buildMediaGrid(i)}</div>
      <button class="add-media-btn" onclick="addSlot(${i})">+ Weiteres Foto / Video hinzufügen</button>

      <label class="field-label" for="txt-${i}">Geschichte & Erinnerung</label>
      <textarea class="text-field" id="txt-${i}" rows="3"
        placeholder="Was war besonders? Eine schöne Erinnerung aus dieser Zeit..."
        oninput="state.chapters[${i}].text=this.value">${ch.text}</textarea>

      <hr class="divider">

      <p class="section-head">🎯 Quiz-Fragen</p>
      <p class="section-sub">Gäste raten, was sie über Rahel wissen</p>
      <div id="quiz-edit-${i}">${buildQuizEdit(i)}</div>
      <button class="add-q-btn" onclick="addQuestion(${i})">+ Frage hinzufügen</button>

      <hr class="divider">

      <p class="section-head">💌 Glückwünsche</p>
      <p class="section-sub">Gäste können hier für Rahel schreiben</p>
      <div id="greetings-list-edit">${buildGreetings()}</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <input type="text" id="g-name" class="text-field" placeholder="Dein Name" style="resize:none">
        <textarea class="text-field" id="g-msg" rows="2" placeholder="Deine Nachricht an Rahel..."></textarea>
        <button class="send-btn" onclick="sendGreeting()">💌 Senden</button>
      </div>

      <div class="bottom-nav">
        <button class="nav-arrow" onclick="setChapter(${i-1})" ${i===0?'disabled':''}>← Zurück</button>
        <span class="chapter-counter">${i+1} / ${CHAPTERS.length}</span>
        <button class="nav-arrow fwd" onclick="setChapter(${i+1})" ${i===CHAPTERS.length-1?'disabled':''}>Weiter →</button>
      </div>
    </div>
  `;
}

function buildMediaGrid(i) {
  const ch = state.chapters[i];
  const totalSlots = Math.max(4, ch.media.length % 2 === 0 ? ch.media.length + 2 : ch.media.length + 1);
  let html = '';
  for (let s = 0; s < totalSlots; s++) {
    const m = ch.media[s];
    if (m) {
      if (m.type === 'video') {
        html += `<div class="media-slot video-wide">
          <video src="${m.url}" controls></video>
          <button class="del-btn" onclick="removeMedia(${i},${s})">✕</button>
        </div>`;
      } else {
        html += `<div class="media-slot">
          <img src="${m.url}" alt="Foto">
          <button class="del-btn" onclick="removeMedia(${i},${s})">✕</button>
        </div>`;
      }
    } else {
      html += `<div class="media-slot" onclick="openUpload(${i},${s})">
        <span class="slot-icon">📷</span>
        <span class="slot-label">Foto / Video</span>
      </div>`;
    }
  }
  return html;
}

function openUpload(ci, si) { pendingSlot = { ci, si }; document.getElementById('file-input').click(); }
document.getElementById('file-input').addEventListener('change', function(e) {
  const f = e.target.files[0]; if (!f || !pendingSlot) return;
  const { ci, si } = pendingSlot;
  const url = URL.createObjectURL(f);
  state.chapters[ci].media[si] = { url, type: f.type.startsWith('video') ? 'video' : 'image' };
  this.value = ''; pendingSlot = null; renderChapter();
});
function addSlot(i) { state.chapters[i].media.push(null); renderChapter(); }
function removeMedia(ci, si) { state.chapters[ci].media[si] = null; renderChapter(); }

// ── QUIZ EDIT ──
function buildQuizEdit(i) {
  const qs = state.chapters[i].quiz;
  if (!qs.length) return '<p class="empty-hint">Noch keine Fragen – füge welche hinzu!</p>';
  return qs.map((q, qi) => `
    <div class="quiz-card">
      <input type="text" value="${q.q}" placeholder="Frage über Rahel..." oninput="state.chapters[${i}].quiz[${qi}].q=this.value">
      <div class="quiz-options-grid">
        ${q.opts.map((o, oi) => `<input type="text" value="${o}" placeholder="Antwort ${oi+1}" oninput="state.chapters[${i}].quiz[${qi}].opts[${oi}]=this.value">`).join('')}
      </div>
      <div class="correct-row">Richtige Antwort:
        <select onchange="state.chapters[${i}].quiz[${qi}].correct=+this.value">
          ${q.opts.map((_,oi) => `<option value="${oi}" ${q.correct===oi?'selected':''}>Antwort ${oi+1}</option>`).join('')}
        </select>
      </div>
    </div>
  `).join('');
}
function addQuestion(i) {
  state.chapters[i].quiz.push({ q:'', opts:['','','',''], correct:0 });
  document.getElementById(`quiz-edit-${i}`).innerHTML = buildQuizEdit(i);
}

// ── GREETINGS ──
function buildGreetings() {
  if (!state.greetings.length) return '<p class="empty-hint">Noch keine Glückwünsche.</p>';
  return state.greetings.map(g => `
    <div class="greeting-card">
      <div class="gc-name">♥ ${g.name}</div>
      <div class="gc-msg">${g.msg}</div>
      <div class="gc-time">${g.time}</div>
    </div>
  `).join('');
}
function sendViaWhatsApp(name, msg) {
  const text = encodeURIComponent(`💌 Glückwunsch von ${name}:\n\n${msg}\n\n🎉 Rahels Konfirmation 2025`);
  window.open(`https://wa.me/41795496410?text=${text}`, '_blank');
}
function sendGreeting() {
  const name = document.getElementById('g-name').value.trim();
  const msg  = document.getElementById('g-msg').value.trim();
  if (!name || !msg) return;
  state.greetings.push({ name, msg, time: new Date().toLocaleTimeString('de-CH', { hour:'2-digit', minute:'2-digit' }) });
  document.getElementById('g-name').value = '';
  document.getElementById('g-msg').value = '';
  document.getElementById('greetings-list-edit').innerHTML = buildGreetings();
  sendViaWhatsApp(name, msg);
}
function sendGreetingPreview() {
  const name = document.getElementById('pg-name').value.trim();
  const msg  = document.getElementById('pg-msg').value.trim();
  if (!name || !msg) return;
  state.greetings.push({ name, msg, time: new Date().toLocaleTimeString('de-CH', { hour:'2-digit', minute:'2-digit' }) });
  document.getElementById('pg-name').value = '';
  document.getElementById('pg-msg').value = '';
  document.getElementById('preview-greetings-list').innerHTML = buildGreetings();
  sendViaWhatsApp(name, msg);
}

// ── PREVIEW ──
function renderPreview() {
  const pc = document.getElementById('preview-content');
  pc.innerHTML = state.chapters.map((ch, i) => {
    if (ch.id === 'memory') {
      return `<div class="pv-chapter">
        <p class="pv-eyebrow">Spiel</p>
        <p class="pv-title">🃏 Memory</p>
        <p class="pv-text" style="margin-bottom:10px">Finde alle Paare von Rahels Fotos!</p>
        <div id="memory-container"><button class="qp-next-btn" onclick="initMemory()" style="width:100%;margin-top:8px">▶ Spiel starten</button></div>
      </div>`;
    }
    const imgs = ch.media.filter(m => m && m.type === 'image');
    const vids = ch.media.filter(m => m && m.type === 'video');
    const qs   = (ch.quiz || []).filter(q => q.q && q.opts.some(o => o));
    return `
      <div class="pv-chapter">
        <p class="pv-eyebrow">${ch.years}</p>
        <p class="pv-title">${ch.title}</p>
        ${imgs.length ? `<div class="pv-photos">${imgs.map(m=>`<img class="pv-photo" src="${m.url}" alt="Foto">`).join('')}</div>` : ''}
        ${vids.map(m=>`<video class="pv-video" src="${m.url}" controls></video>`).join('')}
        ${ch.text ? `<p class="pv-text">${ch.text}</p>` : ''}
        ${qs.length ? `<div id="qplay-${i}">${buildQuizPlay(i, 0, false, -1)}</div>` : ''}
      </div>
    `;
  }).join('');
  document.getElementById('preview-greetings-list').innerHTML = buildGreetings();
  // init memory after DOM is ready
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (document.getElementById('memory-container')) initMemory();
  }));
  setTimeout(() => { if (document.getElementById('memory-container') && !memState.cards.length) initMemory(); }, 300);
}

function buildQuizPlay(ci, qi, answered, selected) {
  const qs = state.chapters[ci].quiz.filter(q => q.q);
  if (!qs.length) return '';
  if (qi >= qs.length) {
    const sc = state.quizScores[ci] || 0;
    return `<div class="qp-score">
      <div class="score-num">${sc}<span style="font-size:1.5rem;color:var(--text-muted)">/${qs.length}</span></div>
      <p>Richtige Antworten — gut gemacht!</p>
      <button class="qp-replay" onclick="resetQuiz(${ci})">↩ Nochmal spielen</button>
    </div>`;
  }
  const q = qs[qi];
  const prog = qs.map((_,pi) => `<div class="qp-dot${pi<qi?' done':pi===qi?' curr':''}"></div>`).join('');
  const opts = q.opts.filter(o=>o).map((o,oi) => {
    let cls = 'qp-opt';
    if (answered) cls += oi===q.correct?' correct':oi===selected?' wrong':'';
    return `<button class="${cls}" ${answered?'disabled':''} onclick="answerQ(${ci},${qi},${oi})">${o}</button>`;
  }).join('');
  const nxt = answered ? `<button class="qp-next-btn" onclick="nextQ(${ci},${qi+1})">Weiter →</button>` : '';
  return `<div class="qp-progress">${prog}</div>
    <p class="qp-question">${q.q}</p>
    <div class="qp-opts">${opts}</div>${nxt}`;
}

window.answerQ = function(ci, qi, sel) {
  if (!state.quizScores[ci]) state.quizScores[ci] = 0;
  const qs = state.chapters[ci].quiz.filter(q => q.q);
  if (sel === qs[qi].correct) state.quizScores[ci]++;
  document.getElementById(`qplay-${ci}`).innerHTML = buildQuizPlay(ci, qi, true, sel);
};
window.nextQ = function(ci, qi) {
  document.getElementById(`qplay-${ci}`).innerHTML = buildQuizPlay(ci, qi, false, -1);
};
window.resetQuiz = function(ci) {
  state.quizScores[ci] = 0;
  document.getElementById(`qplay-${ci}`).innerHTML = buildQuizPlay(ci, 0, false, -1);
};

// ── MEMORY GAME ──
const MEMORY_PHOTOS = [
  '1778517920856_image.png',
  '1778517978640_image.png',
  '1778518026606_image.png',
  '1778518096958_image.png',
  '1778518129996_image.png',
];

let memState = {
  cards: [],
  flipped: [],
  matched: [],
  moves: 0,
  locked: false,
  timer: 0,
  timerInterval: null,
};

function initMemory() {
  clearInterval(memState.timerInterval);
  const pairs = [...MEMORY_PHOTOS, ...MEMORY_PHOTOS];
  // shuffle
  for (let i = pairs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
  }
  memState = { cards: pairs, flipped: [], matched: [], moves: 0, locked: false, timer: 0, timerInterval: null };
  memState.timerInterval = setInterval(() => {
    memState.timer++;
    const el = document.getElementById('mem-timer');
    if (el) el.textContent = memState.timer + 's';
  }, 1000);
  renderMemory();
}

function renderMemory() {
  const container = document.getElementById('memory-container');
  if (!container) return;
  const won = memState.matched.length === memState.cards.length && memState.cards.length > 0;
  if (won) {
    clearInterval(memState.timerInterval);
    container.innerHTML = `
      <div class="memory-win">
        <span class="win-emoji">🎉</span>
        <h3>Gewonnen!</h3>
        <p>${memState.moves} Züge · ${memState.timer} Sekunden</p>
        <button class="memory-restart" onclick="initMemory()">↩ Nochmal spielen</button>
      </div>`;
    return;
  }
  const grid = memState.cards.map((photo, i) => {
    const isFlipped = memState.flipped.includes(i) || memState.matched.includes(i);
    const isMatched = memState.matched.includes(i);
    return `<div class="mem-card${isFlipped ? ' flipped' : ''}${isMatched ? ' matched' : ''}" onclick="flipCard(${i})">
      <div class="mem-inner">
        <div class="mem-back">🌸</div>
        <div class="mem-front"><img src="${photo}" alt="Rahel"></div>
      </div>
    </div>`;
  }).join('');
  container.innerHTML = `
    <div class="memory-stats">
      <div>Züge: <span id="mem-moves">${memState.moves}</span></div>
      <div>Zeit: <span id="mem-timer">${memState.timer}s</span></div>
      <div>Paare: <span>${memState.matched.length / 2}/${MEMORY_PHOTOS.length}</span></div>
    </div>
    <div class="memory-grid">${grid}</div>
    <button class="memory-restart" onclick="initMemory()">↩ Neu starten</button>`;
}

window.flipCard = function(i) {
  if (memState.locked) return;
  if (memState.flipped.includes(i)) return;
  if (memState.matched.includes(i)) return;
  memState.flipped.push(i);
  renderMemory();
  if (memState.flipped.length === 2) {
    memState.moves++;
    memState.locked = true;
    const [a, b] = memState.flipped;
    if (memState.cards[a] === memState.cards[b]) {
      memState.matched.push(a, b);
      memState.flipped = [];
      memState.locked = false;
      renderMemory();
    } else {
      setTimeout(() => {
        memState.flipped = [];
        memState.locked = false;
        renderMemory();
      }, 1000);
    }
  }
};

// ── PASSWORD ──
function checkPw() {
  const val = document.getElementById('pw-input').value;
  if (val === 'Rahel2010') {
    document.getElementById('pw-screen').style.display = 'none';
  } else {
    document.getElementById('pw-error').textContent = 'Falsches Passwort – versuch nochmal!';
    document.getElementById('pw-input').value = '';
  }
}

// ── ADMIN ──
function openAdminPw() {
  const el = document.getElementById('admin-pw-screen');
  el.style.display = 'flex';
  setTimeout(() => document.getElementById('admin-pw-input').focus(), 50);
}
function closeAdminPw() {
  document.getElementById('admin-pw-screen').style.display = 'none';
  document.getElementById('admin-pw-input').value = '';
  document.getElementById('admin-pw-error').textContent = '';
}
function checkAdminPw() {
  const val = document.getElementById('admin-pw-input').value;
  if (val === 'RahelAdmin2010') {
    closeAdminPw();
    document.getElementById('edit-mode').classList.remove('hidden');
    document.getElementById('preview-mode').classList.add('hidden');
    document.getElementById('admin-bar').style.display = 'none';
    state.mode = 'edit';
    renderNav();
    renderChapter();
  } else {
    document.getElementById('admin-pw-error').textContent = 'Falsches Passwort!';
    document.getElementById('admin-pw-input').value = '';
  }
}

// ── INIT — start in preview mode ──
state.mode = 'preview';
document.getElementById('edit-mode').classList.add('hidden');
document.getElementById('preview-mode').classList.remove('hidden');
renderPreview();
</script>
